# Default configuration. Every value can be overridden at runtime with a
# system property, e.g. mvn test -Dbrowser=firefox -Dheadless=false
base.url=https://www.saucedemo.com
api.base.url=https://jsonplaceholder.typicode.com

browser=chrome
headless=true

# Waits, in seconds
timeout.explicit=10
timeout.pageload=30

# Standard SauceDemo credentials (public demo site - not secrets)
user.standard=standard_user
user.locked=locked_out_user
user.problem=problem_user
user.glitch=performance_glitch_user
password=secret_sauce

screenshot.on.failure=true
retry.count=1
